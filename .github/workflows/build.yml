name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK, so no setup action here —
      # android-actions/setup-android still reaches for the retired "tools"
      # package and fails on current runners.
      - name: Accept SDK licences
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      # Only needed once the NDI SDK is dropped into the tree; without it the
      # native half is skipped entirely (see README).
      - name: Install NDK and CMake
        if: hashFiles('app/src/main/cpp/ndi/include/Processing.NDI.Lib.h') != ''
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          "$SDKMANAGER" --install "ndk;26.1.10909125" "cmake;3.22.1"

      # No gradle-wrapper.jar committed, so let the action manage a pinned Gradle.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: mantra-ndi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
